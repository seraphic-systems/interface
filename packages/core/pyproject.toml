[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seraph-zero-core"
version = "0.1.0"
description = "Storage-independent Seraph node validation and public export"
requires-python = ">=3.10"
dependencies = ["jsonschema[format]>=4.18,<5", "PyYAML>=6.0,<7"]

[project.scripts]
seraph-validate = "seraph_zero_core.validate_nodes:main"
seraph-export = "seraph_zero_core.export_public_nodes:main"
seraph-generate-contract = "seraph_zero_core.generate_public_contract:main"

[tool.setuptools.packages.find]
include = ["seraph_zero_core*"]

[tool.setuptools.package-data]
seraph_zero_core = ["schemas/*.json", "schemas/*.md", "contracts/*.json", "contracts/*.d.ts", "contracts/*.md"]
